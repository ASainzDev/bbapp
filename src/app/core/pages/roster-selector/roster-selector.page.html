


<router-outlet></router-outlet>

@if(creationMode()){
  @if(userRosterTemplate(); as roster){
    <app-team-creation [userSelectedRosterTemplate]="roster" (creationCancelled)="handleTeamCreationCancelled()"></app-team-creation>
  }
}
@else if(selectedRoster(); as roster){
  <app-roster-view [selectedRoster]="roster" (creation)="handleCreationMode($event)" (selectedTeamRosterTemplate)="handleCreationSelectRoster($event)"></app-roster-view>
}@else {
  @for(team of teams; track team.id) {
    <app-roster-button
      [roster] = team
      (selectedRoster)="selectedRoster.set($event)">
    </app-roster-button>
  }
}
