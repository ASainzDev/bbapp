

@for(team of teams; track team.id) {
  <app-roster-button
    [roster] = team
    (selectedRoster)="selectedRoster.set($event)">
  </app-roster-button>
}

<router-outlet></router-outlet>

@if(creationMode() && userSelectedRosterTemplate()){
  <app-team-creation [userSelectedRosterTemplate] = "userSelectedRosterTemplate"></app-team-creation>
}
@if(selectedRoster(); as roster){
  <app-roster-view [selectedRoster]="roster" (creation)="handleCreationMode($event)" (selectedTeamRosterTemplate)="handleCreationSelectRoster($event)"></app-roster-view>
}
